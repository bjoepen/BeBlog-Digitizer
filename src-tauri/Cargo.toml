[package]
name = "beblog-digitizer"
version = "0.1.0"
description = "BeBlog Digitizer macOS foundation"
authors = ["Bernd Jöpen"]
edition = "2021"

[lib]
name = "beblog_digitizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "beblog-digitizer"
path = "src/main.rs"
test = false
bench = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "=2.12.3", features = [] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
tauri-plugin-dialog = "^2"

[dev-dependencies]
tauri = { version = "=2.12.3", features = ["test"] }
